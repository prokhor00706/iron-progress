
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Железный прогресс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #080808;
  --card: #171717;
  --gold: #e8bc74;
  --line: #40392e;
  --text: #f5f1e9;
  --muted: #99938a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}
body::before {
  content: "Ω";
  position: fixed;
  right: -30px;
  top: 60px;
  font-family: Georgia, serif;
  font-size: 310px;
  color: rgba(232,188,116,.035);
  pointer-events: none;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
header {
  padding: 30px 15px 22px;
  text-align: center;
  background: radial-gradient(ellipse at top,#3a2c1c,#080808 75%);
}
.crest {
  font-family: Georgia,serif;
  color: var(--gold);
  font-size: 32px;
  letter-spacing: 9px;
}
header h1 {
  font-size: clamp(27px,8vw,44px);
  line-height: 1.04;
  letter-spacing: 2px;
  margin: 12px 0 8px;
  font-weight: 950;
}
.subtitle {
  color: #b7a999;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 12px 15px 110px;
}
.card {
  background: linear-gradient(145deg,#22201e,#101010 70%);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 7px 25px #0007;
}
h2 {
  margin: 0 0 15px;
  font-size: 17px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
h3 { margin: 0 0 8px; font-size: 16px; }
.gold { color: var(--gold); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.day {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 14px 8px;
  color: white;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #37322e;
}
.day:last-child { border-bottom: 0; }
.day.active {
  background: #c5953920;
  border: 1px solid var(--gold);
  border-radius: 9px;
}
.dayname {
  width: 34px;
  font-weight: 900;
  color: var(--gold);
}
.daydesc { flex: 1; font-size: 13px; }
.btn {
  width: 100%;
  padding: 16px 12px;
  border: 1px solid #f1cb92;
  border-radius: 10px;
  color: #161008;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .6px;
  text-transform: uppercase;
  background: linear-gradient(120deg,#ad8047,#f1d196,#987040);
  margin-top: 10px;
}
.btn.secondary {
  color: var(--text);
  background: #242220;
  border-color: #605749;
}
.btn.danger {
  color: #f1a8a8;
  border-color: #875353;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
}
.stat {
  text-align: center;
  padding: 15px 5px;
  background: #171717;
  border: 1px solid #484039;
  border-radius: 10px;
}
.stat strong {
  display: block;
  font-size: 21px;
  margin: 7px 0;
}
.stat span { font-size: 10px; color: #aaa; }
.exercise {
  border-top: 1px solid #4b4136;
  padding: 17px 0;
}
.exercise:first-child { border-top: 0; }
.exercise h3 { line-height: 1.35; }
.sethead, .setrow {
  display: grid;
  grid-template-columns: 27px 1fr 1fr 42px;
  gap: 7px;
  align-items: center;
}
.sethead {
  color: #aaa;
  font-size: 11px;
  text-align: center;
  margin: 13px 0 6px;
}
.setrow { margin-bottom: 8px; }
.setrow input, select, input[type="date"] {
  width: 100%;
  min-width: 0;
  padding: 12px 5px;
  color: white;
  background: #242424;
  border: 1px solid #625746;
  border-radius: 8px;
  text-align: center;
  outline-color: var(--gold);
}
select, input[type="date"] {
  text-align: left;
  padding: 13px;
  color-scheme: dark;
}
.check {
  height: 43px;
  color: var(--gold);
  background: #252525;
  border: 1px solid #76634a;
  border-radius: 8px;
  font-size: 20px;
}
.check.done {
  background: #5b4626;
  border-color: var(--gold);
  color: white;
}
.mini {
  border: 1px solid #655640;
  background: #24211d;
  border-radius: 8px;
  color: var(--gold);
  padding: 9px 12px;
  margin: 3px 5px 0 0;
  font-size: 12px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.pill {
  padding: 5px 9px;
  border: 1px solid #665138;
  border-radius: 20px;
  color: var(--gold);
  font-size: 11px;
}
.history {
  border-top: 1px solid #39332d;
  padding: 14px 0;
}
.history:first-of-type { border-top: 0; }
.graph {
  width: 100%;
  height: auto;
  display: block;
  margin-top: 12px;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 35px 5px;
}
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  border-top: 1px solid #5b4831;
  padding: 9px 10px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-around;
  z-index: 10;
}
nav button {
  flex: 1;
  border: none;
  background: none;
  color: #999;
  font-size: 12px;
  padding: 6px;
}
nav button.active { color: var(--gold); }
nav .ico {
  display: block;
  font-size: 23px;
  margin-bottom: 4px;
}
.notice {
  font-size: 12px;
  color: #aaa;
  line-height: 1.6;
}
</style>
</head>

<body>
<header>
  <div class="crest">⚔ Ω ⚔</div>
  <h1>ЖЕЛЕЗНЫЙ<br>ПРОГРЕСС</h1>
  <div class="subtitle">Трекер тренировок</div>
</header>

<main id="app"></main>

<nav>
  <button id="tab-plan" onclick="show('plan')">
    <span class="ico">▦</span>План
  </button>
  <button id="tab-workout" onclick="show('workout')">
    <span class="ico">⚒</span>Тренировка
  </button>
  <button id="tab-progress" onclick="show('progress')">
    <span class="ico">▥</span>Прогресс
  </button>
</nav>

<script>
"use strict";

// ПРОГРАММА ТРЕНИРОВОК
const DAYS = [
  {
    short: "ПН",
    name: "Грудь · Плечи · Трицепс",
    exercises: [
      "Пек дек",
      "Жим гантелей в наклоне",
      "Разводки гантелей",
      "Жим в Смите узким",
      "Махи в стороны сидя в тренажере",
      "Жим в Смите из-за головы",
      "Разгибание на трицепс верхнего блока",
      "Трицепс с канатом из-за головы"
    ]
  },
  {
    short: "ВТ",
    name: "Спина (ширина) · Задняя дельта · Бицепс",
    exercises: [
      "Тяга одной рукой верхнего блока",
      "Тяга штанги в наклоне",
      "Тяга одной рукой — гантель / Хаммер",
      "Вертикальная тяга двумя руками в Хаммере",
      "Пуловер с канатом (суперсет)",
      "Задняя дельта в пек деке",
      "Сгибания на бицепс лежа на скамье",
      "Сгибания на бицепс в скамье Скотта"
    ]
  },
  {
    short: "СР",
    name: "Ноги",
    exercises: [
      "Разгибания ног сидя",
      "Присед в Гакке",
      "Жим ногами",
      "Сгибания на бицепс бедра лежа",
      "Сгибания на бицепс бедра сидя",
      "Икры"
    ]
  },
  {
    short: "ЧТ",
    name: "Отдых",
    exercises: []
  },
  {
    short: "ПТ",
    name: "Плечи · Грудь · Трицепс",
    exercises: [
      "Махи в стороны с нижнего блока крест-накрест",
      "Солнышко с гантелями",
      "Жим на плечи в тренажере сидя",
      "Пек дек",
      "Жим на грудь в тренажере лежа",
      "Разгибание на трицепс одной рукой в верхнем блоке",
      "Разгибание гантели одной рукой из-за головы"
    ]
  },
  {
    short: "СБ",
    name: "Спина (толщина) · Задняя дельта · Бицепс",
    exercises: [
      "Пуловер",
      "Горизонтальная тяга в тренажере",
      "Горизонтальная тяга в блоке",
      "Вертикальная тяга в блоке за голову",
      "Становая тяга со стоек",
      "Задняя дельта одной рукой с гантелью",
      "Задняя дельта в Смите из-за спины",
      "Бицепс на нижнем блоке одной рукой",
      "Сгибание на бицепс со штангой"
    ]
  },
  {
    short: "ВС",
    name: "Отдых",
    exercises: []
  }
];

const KEY = "iron_progress_v3";

function emptyData() {
  return { sessions: [], drafts: {} };
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.sessions)) {
      return {
        sessions: saved.sessions,
        drafts: saved.drafts || {}
      };
    }
  } catch (e) {
    console.warn("Ошибка чтения истории", e);
  }
  return emptyData();
}

let db = loadData();
let selectedDay = (new Date().getDay() + 6) % 7;
if (!DAYS[selectedDay].exercises.length) selectedDay = 0;

let selectedDate = localDate(new Date());
let currentScreen = "plan";
let selectedExercise = "";

const app = document.getElementById("app");

function localDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

function formatDate(value) {
  if (!value) return "—";
  const [y,m,d] = value.split("-");
  return d + "." + m + "." + y;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function store() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (e) {
    alert("Не удалось сохранить данные. Проверь память браузера.");
  }
}

function draftKey() {
  return selectedDate + "_" + selectedDay;
}

function currentWeekNumber(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const utc = new Date(Date.UTC(
    d.getFullYear(), d.getMonth(), d.getDate()
  ));
  utc.setUTCDate(utc.getUTCDate() + 4 - (utc.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(utc.getUTCFullYear(),0,1));
  return Math.ceil(((utc - yearStart) / 86400000 + 1) / 7);
}

function exerciseName(name) {
  if (!name.includes("гантель / Хаммер")) return name;
  const week = currentWeekNumber(selectedDate);
  return week % 2 === 0
    ? "Тяга одной рукой с гантелью"
    : "Тяга одной рукой в Хаммере";
}

function getDraft() {
  const key = draftKey();
  if (!db.drafts[key]) {
    db.drafts[key] = DAYS[selectedDay].exercises.map((name) => ({
      name: exerciseName(name),
      sets: Array.from({ length: 3 }, () => ({
        weight: "",
        reps: "",
        done: false
      }))
    }));
    store();
  }
  return db.drafts[key];
}

function show(screen) {
  currentScreen = screen;

  for (const id of ["plan","workout","progress"]) {
    document.getElementById("tab-" + id)
      .classList.toggle("active", id === screen);
  }

  if (screen === "plan") renderPlan();
  if (screen === "workout") renderWorkout();
  if (screen === "progress") renderProgress();

  window.scrollTo(0, 0);
}

function openWorkout(index) {
  selectedDay = index;

  if (DAYS[index].exercises.length === 0) {
    alert("В этот день отдых. Выбери тренировочный день.");
    return;
  }

  show("workout");
}

function renderPlan() {
  const total = db.sessions.length;
  const last = [...db.sessions].sort((a,b) =>
    b.date.localeCompare(a.date)
  )[0];

  let maxWeight = 0;
  db.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      ex.sets.forEach(set => {
        maxWeight = Math.max(maxWeight, Number(set.weight) || 0);
      });
    });
  });

  app.innerHTML = `
    <section class="card">
      <h2>⚔ План на неделю</h2>

      ${DAYS.map((day,i) => `
        <button class="day ${selectedDay === i ? "active" : ""}"
                onclick="openWorkout(${i})">
          <span class="dayname">${day.short}</span>
          <span class="daydesc">${day.name}</span>
          <span class="gold">${day.exercises.length ? "›" : "☾"}</span>
        </button>
      `).join("")}
    </section>

    <button class="btn" onclick="openWorkout(${selectedDay})">
      ⚒ Открыть тренировку
    </button>

    <button class="btn secondary" onclick="show('progress')">
      ▥ История прогресса
    </button>

    <section class="card" style="margin-top:20px">
      <h2>🏆 Статистика</h2>
      <div class="stats">
        <div class="stat">
          <span>ТРЕНИРОВОК</span>
          <strong>${total}</strong>
        </div>
        <div class="stat">
          <span>МАКС. ВЕС</span>
          <strong>${maxWeight || "—"}</strong>
        </div>
        <div class="stat">
          <span>ПОСЛЕДНЯЯ</span>
          <strong style="font-size:13px">
            ${last ? formatDate(last.date) : "—"}
          </strong>
        </div>
      </div>
    </section>
  `;
}

function previousBest(name) {
  let best = 0;
  db.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (ex.name !== name) return;
      ex.sets.forEach(set => {
        best = Math.max(best, Number(set.weight) || 0);
      });
    });
  });
  return best;
}

function renderWorkout() {
  const day = DAYS[selectedDay];
  if (!day.exercises.length) {
    show("plan");
    return;
  }

  const draft = getDraft();
  const done = draft.reduce((sum,ex) =>
    sum + ex.sets.filter(s => s.done).length, 0
  );

  app.innerHTML = `
    <section class="card">
      <div class="row">
        <h2 style="margin:0">${day.short} · Тренировка</h2>
        <span class="pill">${done} ✓</span>
      </div>
      <p class="muted">${day.name}</p>
      <label class="small muted">Дата тренировки</label>
      <input id="workDate" type="date" value="${selectedDate}"
             onchange="changeDate(this.value)"
             style="margin-top:7px">
    </section>

    <section class="card">
      <h2>⚒ Рабочие подходы</h2>

      ${draft.map((ex,i) => `
        <div class="exercise">
          <div class="row">
            <h3>${i+1}. ${escapeHTML(ex.name)}</h3>
            <span class="pill">
              ${ex.sets.filter(s => s.done).length}/${ex.sets.length}
            </span>
          </div>

          ${ex.name.includes("суперсет") ||
            ex.name.includes("двумя руками в Хаммере")
            ? '<div class="small gold">⚡ Суперсет</div>' : ""}

          ${previousBest(ex.name)
            ? `<p class="small muted">
                 Прошлый рекорд: ${previousBest(ex.name)} кг
               </p>` : ""}

          <div class="sethead">
            <span>№</span>
            <span>Вес, кг</span>
            <span>Повторы</span>
            <span>✓</span>
          </div>

          ${ex.sets.map((set,j) => `
            <div class="setrow">
              <span class="small muted">${j+1}</span>
              <input
                type="number"
                inputmode="decimal"
                min="0"
                step="0.5"
                placeholder="кг"
                value="${escapeHTML(set.weight)}"
                oninput="editSet(${i},${j},'weight',this.value)"
              >
              <input
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="раз"
                value="${escapeHTML(set.reps)}"
                oninput="editSet(${i},${j},'reps',this.value)"
              >
              <button class="check ${set.done ? "done" : ""}"
                      onclick="toggleSet(${i},${j})">
                ${set.done ? "✓" : "○"}
              </button>
            </div>
          `).join("")}

          <button class="mini" onclick="addSet(${i})">
            + Подход
          </button>
          <button class="mini" onclick="removeSet(${i})">
            − Подход
          </button>
        </div>
      `).join("")}
    </section>

    <button class="btn" onclick="saveWorkout()">
      ✓ Сохранить тренировку
    </button>

    <button class="btn secondary" onclick="clearDraft()">
      Очистить текущую тренировку
    </button>

    <p class="notice">
      Записи сохраняются автоматически на этом устройстве.
      Укажи вес и повторы, затем отметь выполненный подход
      галочкой. После тренировки нажми «Сохранить».
    </p>
  `;
}

function changeDate(value) {
  if (!value) return;
  selectedDate = value;
  renderWorkout();
}

function editSet(i,j,field,value) {
  const set = getDraft()[i].sets[j];
  set[field] = value.replace(",", ".");
  store();
}

function toggleSet(i,j) {
  const set = getDraft()[i].sets[j];
  if (!set.done) {
    if (set.weight === "" || set.reps === "") {
      alert("Сначала введи рабочий вес и повторения.");
      return;
    }
  }
  set.done = !set.done;
  store();
  renderWorkout();
}

function addSet(i) {
  getDraft()[i].sets.push({
    weight: "",
    reps: "",
    done: false
  });
  store();
  renderWorkout();
}

function removeSet(i) {
  const sets = getDraft()[i].sets;
  if (sets.length <= 1) return;
  sets.pop();
  store();
  renderWorkout();
}

function clearDraft() {
  if (!confirm("Очистить все подходы текущей тренировки?")) return;
  delete db.drafts[draftKey()];
  store();
  renderWorkout();
}

function saveWorkout() {
  const exercises = getDraft().map(ex => ({
    name: ex.name,
    sets: ex.sets.filter(set =>
      set.done &&
      set.weight !== "" &&
      set.reps !== ""
    ).map(set => ({
      weight: Number(set.weight),
      reps: Number(set.reps)
    }))
  })).filter(ex => ex.sets.length > 0);

  if (!exercises.length) {
    alert("Отметь хотя бы один выполненный подход.");
    return;
  }

  const existing = db.sessions.findIndex(s =>
    s.date === selectedDate && s.day === selectedDay
  );

  if (existing !== -1) {
    if (!confirm("Тренировка за эту дату уже есть. Заменить её?")) {
      return;
    }
    db.sessions.splice(existing, 1);
  }

  db.sessions.push({
    id: Date.now().toString(),
    date: selectedDate,
    day: selectedDay,
    exercises
  });

  delete db.drafts[draftKey()];
  store();
  alert("Тренировка сохранена! ⚔");
  show("progress");
}

function allExerciseNames() {
  return [...new Set([
    ...DAYS.flatMap(d => d.exercises),
    ...db.sessions.flatMap(s => s.exercises.map(ex => ex.name))
  ])].filter(name => !name.includes("гантель / Хаммер"));
}

function getPoints(name) {
  const points = [];

  db.sessions.forEach(session => {
    const matches = session.exercises.filter(ex => ex.name === name);
    if (!matches.length) return;

    const sets = matches.flatMap(ex => ex.sets);
    if (!sets.length) return;

    points.push({
      date: session.date,
      weight: Math.max(...sets.map(s => Number(s.weight) || 0)),
      reps: Math.max(...sets.map(s => Number(s.reps) || 0))
    });
  });

  return points.sort((a,b) => a.date.localeCompare(b.date));
}

function drawGraph(points) {
  if (!points.length) {
    return '<div class="empty">Пока нет данных для графика</div>';
  }

  const W = 340, H = 190;
  const left = 38, right = 12, top = 18, bottom = 38;
  const w = W-left-right, h = H-top-bottom;
  const values = points.map(p => p.weight);
  const min = Math.max(0, Math.min(...values)-5);
  const max = Math.max(...values)+5;
  const range = max-min || 1;

  const xy = points.map((p,i) => ({
    x: left + (points.length === 1 ? w/2 : i*w/(points.length-1)),
    y: top + h - (p.weight-min)/range*h,
    ...p
  }));

  const line = xy.map((p,i) =>
    (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)
  ).join(" ");

  let grid = "";
  for (let i=0;i<=4;i++) {
    const y = top + i*h/4;
    const v = max-i*range/4;
    grid += `
      <line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}"
            stroke="#453b31" stroke-dasharray="4 5"/>
      <text x="2" y="${y+4}" fill="#aaa" font-size="10">
        ${v.toFixed(1)}
      </text>
    `;
  }

  return `
    <svg class="graph" viewBox="0 0 ${W} ${H}"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="graphFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8bc74" stop-opacity=".38"/>
          <stop offset="100%" stop-color="#e8bc74" stop-opacity="0"/>
        </linearGradient>
      </defs>

      ${grid}

      <path d="${line} L ${xy[xy.length-1].x} ${top+h}
                    L ${xy[0].x} ${top+h} Z"
            fill="url(#graphFill)"/>

      <path d="${line}" fill="none" stroke="#e8bc74"
            stroke-width="2.5" stroke-linecap="round"/>

      ${xy.map((p,i) => `
        <circle cx="${p.x}" cy="${p.y}" r="4"
                fill="#f2ca88" stroke="#121212" stroke-width="2"/>
        ${i===0 || i===xy.length-1 ? `
        <text x="${p.x}" y="${Math.max(12,p.y-10)}"
              text-anchor="middle" fill="#f2ca88" font-size="11">
          ${p.weight}
        </text>` : ""}
      `).join("")}

      <text x="${left}" y="${H-9}" fill="#aaa" font-size="10">
        ${formatDate(points[0].date).slice(0,5)}
      </text>
      <text x="${W-right}" y="${H-9}" text-anchor="end"
            fill="#aaa" font-size="10">
        ${formatDate(points[points.length-1].date).slice(0,5)}
      </text>
    </svg>
  `;
}

function renderProgress() {
  const names = allExerciseNames();
  if (!names.includes(selectedExercise)) {
    selectedExercise = names[0] || "";
  }

  const points = getPoints(selectedExercise);
  const best = points.length
    ? Math.max(...points.map(p => p.weight))
    : 0;

  const sessions = [...db.sessions]
    .sort((a,b) => b.date.localeCompare(a.date));

  app.innerHTML = `
    <section class="card">
      <h2>▥ Мой прогресс</h2>
      <p class="muted small">Выбери упражнение для просмотра динамики</p>

      <select onchange="selectExercise(this.value)">
        ${names.map(name => `
          <option value="${escapeHTML(name)}"
            ${selectedExercise === name ? "selected" : ""}>
            ${escapeHTML(name)}
          </option>
        `).join("")}
      </select>

      <div class="stats" style="margin-top:16px">
        <div class="stat">
          <span>ЛУЧШИЙ ВЕС</span>
          <strong>${best} кг</strong>
        </div>
        <div class="stat">
          <span>ЗАПИСЕЙ</span>
          <strong>${points.length}</strong>
        </div>
        <div class="stat">
          <span>МАКС. ПОВТОРЫ</span>
          <strong>${points.length
            ? Math.max(...points.map(p => p.reps))
            : "—"}</strong>
        </div>
      </div>

      <h3 style="margin-top:24px">Динамика рабочего веса</h3>
      ${drawGraph(points)}
    </section>

    <section class="card">
      <h2>🏆 История тренировок</h2>

      ${sessions.length ? sessions.map(s => `
        <div class="history">
          <div class="row">
            <div>
              <strong>${formatDate(s.date)}</strong>
              <p class="small muted">
                ${DAYS[s.day].name}
              </p>
            </div>
            <button class="mini"
                    onclick="openHistory('${s.id}')">
              Открыть ›
            </button>
          </div>
        </div>
      `).join("") : `
        <div class="empty">
          История пока пуста.<br>
          Сохрани первую тренировку!
        </div>
      `}
    </section>

    <section class="card">
      <h2>⤓ Резервная копия</h2>
      <p class="notice">
        Сохрани историю в файл, чтобы перенести её на другой
        телефон или восстановить после очистки браузера.
      </p>
      <button class="btn secondary" onclick="exportData()">
        Скачать историю
      </button>
      <button class="btn secondary" onclick="document.getElementById('backupFile').click()">
        Восстановить историю
      </button>
      <input type="file" id="backupFile"
             accept=".json,application/json"
             style="display:none" onchange="importData(this)">
    </section>
  `;
}

function selectExercise(name) {
  selectedExercise = name;
  renderProgress();
}

function openHistory(id) {
  const s = db.sessions.find(x => x.id === id);
  if (!s) return;

  app.innerHTML = `
    <section class="card">
      <h2>⚔ ${formatDate(s.date)}</h2>
      <p class="muted">${DAYS[s.day].name}</p>

      ${s.exercises.map(ex => `
        <div class="exercise">
          <h3>${escapeHTML(ex.name)}</h3>
          ${ex.sets.map((set,i) => `
            <div class="row history">
              <span class="muted">Подход ${i+1}</span>
              <strong>${set.weight} кг × ${set.reps}</strong>
            </div>
          `).join("")}
        </div>
      `).join("")}
    </section>

    <button class="btn secondary" onclick="show('progress')">
      ← Назад к прогрессу
    </button>
    <button class="btn danger" onclick="deleteHistory('${id}')">
      Удалить эту тренировку
    </button>
  `;
}

function deleteHistory(id) {
  if (!confirm("Удалить эту тренировку из истории?")) return;
  db.sessions = db.sessions.filter(s => s.id !== id);
  store();
  show("progress");
}

function exportData() {
  const blob = new Blob([JSON.stringify(db,null,2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "iron-progress-" + localDate(new Date()) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importData(input) {
  if (!input.files.length) return;

  try {
    const data = JSON.parse(await input.files[0].text());

    if (!Array.isArray(data.sessions)) {
      throw new Error("Неверный формат");
    }

    if (!confirm("Заменить текущую историю данными из файла?")) return;

    db = {
      sessions: data.sessions,
      drafts: data.drafts || {}
    };

    store();
    show("progress");
    alert("История восстановлена!");
  } catch(e) {
    alert("Ошибка импорта: " + e.message);
  }
}

if (window.Telegram && window.Telegram.WebApp) {
  try {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor("#080808");
    Telegram.WebApp.setBackgroundColor("#080808");
  } catch(e) {
    console.warn(e);
  }
}

show("plan");
</script>
</body>
</html>
